name: Butter in the Salsa Pages
on:
  pull_request:
    paths: ["site/**", ".abbey/project.yml", ".github/workflows/pages.yml"]
  push:
    branches: [main]
    paths: ["site/**", ".abbey/project.yml", ".github/workflows/pages.yml"]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            site/poll-api/package-lock.json
      - run: npm ci
      - name: Install poll test dependencies
        run: npm ci --prefix poll-api
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Validate production artifact and poll tests
        run: npm run validate:release
        env:
          WRANGLER_SEND_METRICS: "false"
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site/dist
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
